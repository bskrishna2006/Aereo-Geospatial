version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: aereo_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geomeasure_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geomeasure_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aereo_geospatial_api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/geomeasure_db
      - UPLOAD_DIRECTORY=/tmp/aereo_geospatial_uploads
      - MAX_UPLOAD_SIZE_MB=50
      - SYNC_PROCESSING=true
      - LOG_LEVEL=INFO
    volumes:
      - uploads_volume:/tmp/aereo_geospatial_uploads
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_volume:
